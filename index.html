<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CampusConnect: a social and academic platform for polytechnic students. Share notes, ask questions, join groups and read campus notices.">
<meta name="theme-color" content="#123B70">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>CampusConnect</title>

<!-- Speed up the connections to the CDNs used below -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem("cc-theme")==="dark")document.documentElement.setAttribute("data-bs-theme","dark");}catch(e){}</script>
<link href="css/style.css" rel="stylesheet">
<!-- PWA: install to home screen -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CampusConnect">
</head>
<body>
<!-- Shown only until the JavaScript renders the app -->
<div id="app">
  <div class="d-flex flex-column align-items-center justify-content-center min-vh-100 text-muted" role="status">
    <i class="fa-solid fa-graduation-cap fa-2x mb-3"></i>
    <span>Loading CampusConnect…</span>
  </div>
</div>

<!-- One reusable modal used for every form and confirmation -->
<div class="modal fade" id="ccModal" tabindex="-1" aria-labelledby="ccModalTitle" aria-hidden="true">
 <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
  <div class="modal-content">
   <div class="modal-header"><h5 class="modal-title" id="ccModalTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
   <div class="modal-body" id="ccModalBody"></div>
   <div class="modal-footer">
    <div id="ccModalErr" class="text-danger small me-auto" role="alert"></div>
    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
    <button type="button" class="btn btn-primary" id="ccModalOk">Save</button>
   </div>
  </div>
 </div>
</div>

<!-- Toast notifications are announced to screen readers -->
<div class="toast-wrap" id="toastWrap" role="status" aria-live="polite" aria-atomic="false"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/firebase.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/router.js"></script>
<script src="js/pages/home.js"></script>
<script src="js/pages/institute.js"></script>
<script src="js/pages/profile.js"></script>
<script src="js/pages/user.js"></script>
<script src="js/pages/following.js"></script>
<script src="js/pages/groups.js"></script>
<script src="js/pages/resources.js"></script>
<script src="js/pages/qa.js"></script>
<script src="js/pages/notices.js"></script>
<script src="js/pages/events.js"></script>
<script src="js/pages/lost-found.js"></script>
<script src="js/pages/notifications.js"></script>
<script src="js/pages/admin.js"></script>
<script src="js/pages/messages.js"></script>
<script src="js/chat-attach.js"></script>
<script src="js/chat-popup.js"></script>
<script src="js/chat-unread.js"></script>
<script src="js/bot.js"></script>
<script src="js/app.js"></script>
<script>
// PWA: register the service worker (needs https or localhost)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW failed:', err)));
}
</script>
</body>
</html>
